name: refresh-stops
# The TTC publishes a new schedule roughly every six weeks. Rebuild the
# shipped stop table from Toronto Open Data and open a pull request when it
# changed, so the plugin never drifts from the feeds it reads.
on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays, 09:17 UTC
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild data/stops.json from the current GTFS feeds
        run: python3 tools/build_stops.py
      - name: Verify the table still passes the offline tests
        run: |
          node --test test/model.test.js
          python3 -m unittest discover -s test/python
      - name: Open a pull request when the table changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Compare everything except the generation timestamp, so an
          # unchanged feed does not open a pull request every week.
          changed=$(python3 - <<'PY'
          import json, subprocess
          def strip(text):
              d = json.loads(text); d.get("meta", {}).pop("generated", None); return json.dumps(d, sort_keys=True)
          out = []
          for f in ("data/stops.json", "data/trips.json"):
              old = subprocess.run(["git", "show", f"HEAD:{f}"], capture_output=True, text=True).stdout or "{}"
              out.append(strip(old) != strip(open(f).read()))
          print("yes" if any(out) else "no")
          PY
          )
          if [[ $changed != yes ]]; then
            echo "stop table unchanged"; git checkout -- data; exit 0
          fi
          version=$(python3 -c 'import json; m=json.load(open("data/stops.json"))["meta"]; print(m["surface_feed"]["version"], m["classic_service"]["start"], m["classic_service"]["end"])')
          branch="refresh-stops/$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/stops.json data/trips.json
          git commit -m "Refresh stop table from TTC GTFS ($version)"
          git push -u origin "$branch"
          gh pr create --title "Refresh stop table from TTC GTFS ($version)" \
            --body "Automated rebuild of data/stops.json from Toronto Open Data. Feed: $version. Review the diff summary, then merge." \
            --base main --head "$branch"
